# tmux — Catppuccin Mocha
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 0
set -g focus-events on
set -g mouse on
setw -g aggressive-resize on
set -g mode-keys vi
set -g status-position top
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=#1e1e2e fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#1e1e2e,nobold] "
set -g status-right "#[fg=#a6adc8]%H:%M #[fg=#cba6f7]%d-%b "
set -g window-status-format "#[fg=#a6adc8] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244 fg=#cdd6f4"
set -g message-command-style "bg=#313244 fg=#cdd6f4"
set -g mode-style "bg=#cba6f7 fg=#1e1e2e"
set -g display-panes-active-colour "#cba6f7"
set -g display-panes-colour "#45475a"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
