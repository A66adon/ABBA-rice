general {
    hide_cursor = false
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/catppuccin-mocha.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.65
}

input-field {
    monitor =
    size = 260, 46
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(1e1e2eff)
    font_color = rgba(cdd6f4ff)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgba(cdd6f4ff)
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgba(a6adc8ff)
    position = 0, 40
    halign = center
    valign = center
}
